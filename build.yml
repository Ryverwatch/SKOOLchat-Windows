name: Build SKOOLchat Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release exe
        run: cargo build --release

      - name: Publish public download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: SKOOLchat Windows v1.${{ github.run_number }}
          make_latest: true
          body: Download SKOOLchat-Windows.exe below and double-click it to run.
          files: target/release/SKOOLchat-Windows.exe
